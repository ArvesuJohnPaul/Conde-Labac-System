<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content-Security-Policy. Mirrors the header from
         conde-labak-server/hardening.js, which does not reach these pages in
         production because GitHub Pages serves them and cannot send headers.
         connect-src has to name the API host here, so it must be changed in
         step with PERMANENT_API_BASE in js/api-config.js. frame-ancestors is
         absent because a <meta> CSP cannot carry it. Full reasoning: the same
         tag in index.html, and SECURITY-PLAN.md section 5. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
               script-src-attr 'unsafe-inline';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' data: https://fonts.gstatic.com;
               img-src 'self' data: blob:;
               media-src 'self';
               connect-src 'self' https://conde-labak.onrender.com;
               object-src 'none';
               base-uri 'self';
               form-action 'self'"
    />
    <meta name="robots" content="noindex" />
    <title>Brgy. Conde Labak – SMS Log</title>
    <link rel="icon" type="image/x-icon" href="../img/conde_labak_icon.ico" />
    <script src="../js/theme.js"></script>
    <script src="../js/i18n.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/tokens.css" />
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/system.css" />
    <!-- gis.css: the shared .gis-filter-row / .gis-search-* pill toolbar, the
         same one Residency, Certificates and User Management use. -->
    <link rel="stylesheet" href="../css/gis.css" />
    <!-- The motion layer loads last: a few of its rules replace a one-shot
         animation with a two-way one and have to win the cascade. -->
    <link rel="stylesheet" href="../css/motion.css" />
    <!-- The phone layer. Loads after motion.css so it can correct the
         module stylesheets at phone widths without any of them growing a
         second set of breakpoints: stacked data tables, 44px touch targets,
         the topbar heading, the scrollers. -->
    <link rel="stylesheet" href="../css/mobile.css" />
    <script src="../js/icons.js"></script>
    <script src="../js/preferences.js"></script>
    <script src="../js/account-edit.js"></script>
    <script src="../js/sms-settings.js"></script>
    <script src="../js/sms-alerts.js"></script>
    <script src="../js/change-password.js"></script>
    <script src="../js/api-config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/hotlines.js"></script>
    <script src="../js/mis-access.js"></script>
    <script src="../js/audit-log.js"></script>
    <script src="../js/feedback-store.js"></script>
  </head>
  <body data-module="sms">
    <!-- --- APP SHELL --- -->
    <!-- App shell (sidebar, topbar, module launcher) is rendered by js/app-shell.js -->
    <div id="app"></div>

    <!-- TOAST -->
    <div id="toast" class="toast">
      <span id="toast-icon"><i data-icon=check></i></span><span id="toast-msg">Success</span>
    </div>

    <!-- SCRIPTS -->
    <script src="../js/app-shell.js"></script>
    <script src="../js/shell.js"></script>
    <!-- The sign-in briefing: what came in while this officer was away,
         and what they left unfinished. Reads the session the shell has
         already applied, so it comes after it. -->
    <script src="../js/staff-briefing.js"></script>
    <script src="../js/pages/sms.js"></script>
    <!-- Certificates: the shared type list, then the export machinery,
         then the printable forms (each reads the one before it). All three
         must precede portal-account.js. -->
    <!-- Escape closes the topmost modal. -->
    <script src="../js/ui-modals.js"></script>
    <script src="../js/certificate-types.js"></script>
    <script src="../js/certificate-export.js"></script>
    <script src="../js/certificate-templates.js"></script>
    <script src="../js/certificate-attachments.js"></script>
    <script src="../js/portal-account.js"></script>
    <!-- Motion runtime: collapse/validation/exit animations. Last, so it
         observes a DOM every other script has already set up. -->
    <script src="../js/input-guard.js"></script>
    <!-- Copies each table's own column headings onto its cells, so the
         stacked card layout css/mobile.css uses below 640px can print them.
         After the page module, which is what draws the tables. -->
    <script src="../js/mobile.js"></script>
    <script src="../js/motion.js"></script>
  </body>
</html>
