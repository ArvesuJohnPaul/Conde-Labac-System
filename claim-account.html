<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Apply for a resident account on the Barangay Conde Labak portal, Batangas City." />
    <title>Apply for an Account | Brgy. Conde Labac</title>
    <link rel="icon" type="image/x-icon" href="img/conde_labac_icon.ico" />
    <script src="js/theme.js"></script>
    <script src="js/i18n.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/system.css" />
    <!-- The motion layer loads last: a few of its rules replace a one-shot
         animation with a two-way one and have to win the cascade. -->
    <link rel="stylesheet" href="css/motion.css" />
    <!-- This page's own layout: the card and the step dots. -->
    <link rel="stylesheet" href="css/claim-account.css" />
      <script src="js/api-config.js"></script>
      <script src="js/api.js"></script>
      <script src="js/icons.js"></script>
      <script src="js/preferences.js"></script>
      <script src="js/account-edit.js"></script>
      <script src="js/sms-settings.js"></script>
    <script src="js/sms-alerts.js"></script>
      <script src="js/change-password.js"></script>
    <script src="js/audit-log.js"></script>
    <script src="js/account-application.js"></script>
  </head>
  <body>
    <div class="claim-card">
      <div class="claim-head">
        <div class="claim-seal">
          <img src="img/conde%20labac%20logo.png" alt="Conde Labac Seal" />
        </div>
        <h1 class="claim-title">Apply for an Account</h1>
        <p class="claim-subtitle">
          Your C.A.R.E.S. resident account, checked against a valid ID by a
          barangay official before it is opened.
        </p>
      </div>

      <!-- The wizard (details → valid ID → submitted) is js/account-application.js,
           shared with the portal's service modal. -->
      <div id="acc-app-root"></div>

      <a href="system.html" class="claim-back-link"><i data-icon=arrow-left></i> Back to Sign In</a>
    </div>

    <!-- -- SUCCESS TOAST -- -->
    <div id="toast" class="toast">
      <span id="toast-icon"><i data-icon=check></i></span>
      <span id="toast-msg">Success</span>
    </div>

    <script>
      function showToast(msg, icon = "<i data-icon=check></i>") {
        const t = document.getElementById("toast");
        document.getElementById("toast-msg").textContent = msg;
        document.getElementById("toast-icon").innerHTML = icon;
        t.style.transform = "translateY(0)";
        t.style.opacity = "1";
        setTimeout(() => {
          t.style.transform = "translateY(100px)";
          t.style.opacity = "0";
        }, 3500);
      }
      AccountApplication.mount(document.getElementById("acc-app-root"), { mode: "page" });
    </script>
    <!-- Motion runtime: collapse/validation/exit animations. Last, so it
         observes a DOM every other script has already set up. -->
    <script src="js/input-guard.js"></script>
    <script src="js/motion.js"></script>
  </body>
</html>
