<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting… | Barangay Conde Labac</title>
    <link rel="icon" type="image/x-icon" href="img/conde_labac_icon.ico" />
    <!-- The announcements + barangay officials editors moved out of Settings
         into their own MIS module: MIS → Site Content (pages/content.html).
         This page is kept only so old links/bookmarks land in the new place. -->
    <script>
      const SESSION_KEY = "ibmdss.session";
      let session = null;
      try {
        session = JSON.parse(localStorage.getItem(SESSION_KEY));
      } catch (e) {
        session = null;
      }
      const isStaff =
        session && (session.role === "Admin" || session.role === "Officer");
      // Staff → the new Site Content page; anyone else → back to the landing page.
      window.location.replace(isStaff ? "pages/content.html" : "index.html");
    </script>
  </head>
  <body>
    <noscript>
      <p>
        Site content editing has moved to the MIS. Open
        <a href="pages/content.html">MIS → Site Content</a>.
      </p>
    </noscript>
  </body>
</html>
